<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAP HBJ - Hinário</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192x192.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Define a cor de fundo do PWA */
        :root {
            --paper-color: #fff8e1; /* Cor de pergaminho leve */
            --ink-color: #3e2723; /* Cor de tinta escura */
            --accent-color: #a1887f; /* Cor de realce (marrom) */
            --border-color: #d7ccc8; /* Cor de borda suave */
        }

        body {
            font-family: 'Georgia', 'serif'; /* Fonte mais clássica */
            background-color: var(--paper-color);
            color: var(--ink-color);
        }

        /* Estilo para pré-formatar a letra, mantendo quebras de linha com toque clássico */
        .hymn-text {
            white-space: pre-wrap;
            line-height: 1.8; /* Aumenta o espaçamento para legibilidade */
            font-size: 1.1rem; /* Tamanho base ajustável */
            border-left: 2px solid var(--border-color); /* Linha sutil de pergaminho */
            padding-left: 1rem;
            margin-bottom: 2rem;
            text-align: justify;
        }

        /* Aplica o estilo de pergaminho ao container do app */
        #app-container {
            background-color: var(--paper-color);
            border: 5px double var(--accent-color); /* Borda estilo antigo */
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        /* Classe para esconder telas */
        .hidden-screen {
            display: none;
        }
        
        /* Scrollbar limpa */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background-color: var(--accent-color);
            border-radius: 4px;
        }
        
        /* Tema de cores do Tailwind adaptado */
        .text-primary { color: var(--ink-color); }
        .bg-accent { background-color: var(--accent-color); }
        .hover\:bg-accent-light:hover { background-color: #e0ac93; }

    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start">

    <div id="app-container" class="w-full max-w-lg shadow-xl min-h-screen">

        <nav class="fixed bottom-0 w-full max-w-lg bg-accent text-white shadow-2xl z-10 p-2 flex justify-around">
            <button id="nav-list" class="p-2 flex flex-col items-center focus:outline-none transition duration-150 hover:opacity-80">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h16M4 12h16m-7 6h7"/></svg>
                <span class="text-xs">Hinos</span>
            </button>
            <button id="nav-favorites" class="p-2 flex flex-col items-center focus:outline-none transition duration-150 hover:opacity-80">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor"><path d="M11.645 20.91l-.007-.003-.013-.005a48.674 48.674 0 01-1.275-.521 48.24 48.24 0 01-5.748-3.255L4.856 16.5c-1.9-1.5-2.6-3.8-1.7-5.7A5.98 5.98 0 018 7c1.378 0 2.844.755 4 2.454C14.156 7.755 15.622 7 17 7a5.98 5.98 0 014.854 3.8A5.98 5.98 0 0119.5 16.5l-2.28 1.48a48.24 48.24 0 01-5.748 3.255c-.244.17-.487.337-.738.498l-.013.005-.007.003-.002.001-.001.001z"/></svg>
                <span class="text-xs">Favoritos</span>
            </button>
        </nav>
        
        <div id="hymn-list-screen" class="p-4 sm:p-6 transition-transform duration-300 pb-20">
            <h1 class="text-3xl font-extrabold text-primary mb-6 text-center">
                IAP HBJ Hinário
            </h1>
            
            <div id="install-button-container" class="mb-6 text-center hidden">
                <button id="install-button"
                        class="px-4 py-2 bg-accent text-white font-bold rounded-lg shadow-md hover:bg-ink-color transition duration-300 flex items-center justify-center mx-auto">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 mr-2">
                        <path fill-rule="evenodd" d="M11.47 1.72a.75.75 0 0 1 1.06 0l3.05 3.05a.75.75 0 0 1-1.06 1.06L12.75 3.31v7.94a.75.75 0 0 1-1.5 0V3.31L8.38 5.83a.75.75 0 0 1-1.06-1.06z" clip-rule="evenodd" />
                        <path fill-rule="evenodd" d="M3 15.75v-1.5a.75.75 0 0 1 .75-.75h4.78a2.25 2.25 0 0 0 1.956-1.01l.983-1.476a.75.75 0 0 1 1.498 0l.983 1.476a2.25 2.25 0 0 0 1.956 1.01h4.78a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-.75.75H3.75a.75.75 0 0 1-.75-.75zM3.75 18a.75.75 0 0 0 0 1.5h16.5a.75.75 0 0 0 0-1.5H3.75zM3 20.25a.75.75 0 0 1 .75-.75h16.5a.75.75 0 0 1 0 1.5H3.75a.75.75 0 0 1-.75-.75z" clip-rule="evenodd" />
                    </svg>
                    Instalar Aplicativo
                </button>
            </div>
            <input type="text" id="search-input" placeholder="Buscar por nº ou título..."
                    class="w-full p-3 mb-6 border border-gray-300 rounded-xl shadow-inner focus:ring-accent focus:border-accent text-primary transition-all duration-300"
                    style="background-color: #f7f3e8;">

            <div id="hymn-list-container" class="space-y-2">
                </div>

            <p id="no-results" class="text-center text-gray-500 mt-8 hidden">
                Nenhum hino encontrado.
            </p>
        </div>

        <div id="favorites-screen" class="hidden-screen p-4 sm:p-6 transition-transform duration-300 pb-20">
            <h1 class="text-3xl font-extrabold text-primary mb-6 text-center">
                ❤️ Meus Hinos Favoritos
            </h1>
            <div id="favorites-list-container" class="space-y-2">
                </div>
            <p id="no-favorites" class="text-center text-gray-500 mt-8">
                Você ainda não adicionou nenhum hino aos favoritos.
            </p>
        </div>

        <div id="hymn-view-screen" class="hidden-screen p-4 sm:p-6 transition-transform duration-300 pb-20">
            
            <header class="sticky top-0 pt-4 bg-paper-color z-10 border-b pb-4 mb-6" style="background-color: var(--paper-color); border-bottom: 1px solid var(--border-color);">
                
                <div class="flex items-center justify-between mb-4">
                    <button id="back-button"
                        class="text-accent hover:text-ink-color transition duration-150 p-2 -ml-2 rounded-full focus:outline-none focus:ring-2 focus:ring-accent">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-6 h-6">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
                        </svg>
                    </button>
                    <button id="favorite-toggle-button" 
                            class="text-gray-400 hover:text-red-500 transition duration-150 p-2 rounded-full focus:outline-none focus:ring-2 focus:ring-red-500">
                        <svg id="fav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6"><path d="M11.645 20.91l-.007-.003-.013-.005a48.674 48.674 0 01-1.275-.521 48.24 48.24 0 01-5.748-3.255L4.856 16.5c-1.9-1.5-2.6-3.8-1.7-5.7A5.98 5.98 0 018 7c1.378 0 2.844.755 4 2.454C14.156 7.755 15.622 7 17 7a5.98 5.98 0 014.854 3.8A5.98 5.98 0 0119.5 16.5l-2.28 1.48a48.24 48.24 0 01-5.748 3.255c-.244.17-.487.337-.738.498l-.013.005-.007.003-.002.001-.001.001z" /></svg>
                    </button>
                </div>

                <h2 id="hymn-title-display" class="text-2xl font-bold text-primary truncate mb-4"></h2>

                <div class="flex justify-end items-center space-x-2 text-primary text-sm">
                    <span class="text-xs text-gray-600">Tamanho da Fonte:</span>
                    <button id="font-decrease" title="Diminuir Fonte" class="p-1 border border-accent rounded-full w-8 h-8 flex items-center justify-center hover:bg-accent-light transition duration-150">A-</button>
                    <button id="font-increase" title="Aumentar Fonte" class="p-1 border border-accent rounded-full w-8 h-8 flex items-center justify-center hover:bg-accent-light transition duration-150">A+</button>
                </div>
            </header>
            
            <div id="hymn-lyrics-display" class="hymn-text text-primary">
                </div>
        </div>

    </div>

    <script>
        // --- DADOS DO HINÁRIO ---
        const hymnData = [
            {
                "id":1,
                "nome":"Santo, santo, Pai bondoso!",
                "letra":"Santo, santo, Pai bondoso, \nSanto, santo, Deus poderoso;\nEntregamos nossos corações a ti, em devoção.\nPai bondoso, te adoramos.\n\nSanto, santo, Cristo amado,\nPela cruz, nós somos redimidos;\nElevamos nossas mentes, em constante adoração.\nCristo amado, te adoramos.\n\nSanto, santo, Santo Espírito,\nEnche de poder as nossas vidas!\nSuplicamos tua graça, teu auxílio e direção.\nSanto Espírito, te adoramos."
            },
            {
                "id":2,
                "nome":"Santo, Santo, Santo",
                "letra":"Santo! Santo! Santo! Rei e Poderoso!\nAo amanhecer o teu nome louvarei,\nSanto! Santo! Santo! Bom e Piedoso!\nDiante de ti pra sempre cantarei!\n\nSanto! Santo! Santo! Nós te adoramos!\nDiante da tua glória, em plena submissão,\nAos teus pés prostrados; te glorificamos,\nPra sempre és digno de adoração.\n\nSanto! Santo! Santo! Nós os pecadores\nTua glória eterna não conseguimos ver,\nMas por sua graça, somos protegidos\nÉs nosso Deus de amor e de poder.\n\nSanto! Santo! Santo! Fiel e poderoso,\nTodos nós rendemos louvor a ti, Senhor,\nSanto! Santo! Santo! Fiel e poderoso,\nÉs um só Deus, eterno Criador."
            },
            // Adicione todos os outros hinos aqui...
        ];

        // --- REFERÊNCIAS DOM ---
        const appContainer = document.getElementById('app-container');
        const listScreen = document.getElementById('hymn-list-screen');
        const viewScreen = document.getElementById('hymn-view-screen');
        const favoritesScreen = document.getElementById('favorites-screen');
        const searchInput = document.getElementById('search-input');
        const listContainer = document.getElementById('hymn-list-container');
        const favoritesListContainer = document.getElementById('favorites-list-container');
        const noResults = document.getElementById('no-results');
        const noFavorites = document.getElementById('no-favorites');
        const backButton = document.getElementById('back-button');
        const hymnTitleDisplay = document.getElementById('hymn-title-display');
        const hymnLyricsDisplay = document.getElementById('hymn-lyrics-display');
        const favoriteToggleButton = document.getElementById('favorite-toggle-button');
        const favIcon = document.getElementById('fav-icon');
        const fontIncreaseButton = document.getElementById('font-increase');
        const fontDecreaseButton = document.getElementById('font-decrease');
        const navList = document.getElementById('nav-list');
        const navFavorites = document.getElementById('nav-favorites');
        // Novas referências para a instalação
        const installButtonContainer = document.getElementById('install-button-container');
        const installButton = document.getElementById('install-button');


        let currentHymnId = null; // Armazena o ID do hino atualmente visualizado
        const FAVORITES_KEY = 'iap_hbj_favorites';
        const FONT_SIZE_KEY = 'iap_hbj_font_size';
        const MIN_FONT_SIZE = 1.0;
        const MAX_FONT_SIZE = 1.5;
        const FONT_STEP = 0.1;
        let deferredPrompt; // Variável para armazenar o evento de instalação
        
        // --- FUNÇÕES DE DETECÇÃO DE AMBIENTE ---

        /**
         * Detecta se o app está rodando em modo standalone (PWA instalado)
         * ou em um WebView (que é o caso do seu app Android).
         * @returns {boolean} True se for um ambiente nativo/instalado/webview
         */
        function isRunningInApp() {
            // 1. Detecta o modo Standalone (PWA já instalado)
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches;

            // 2. Detecta um WebView (pode ser 'wv' no Chrome ou uma string personalizada)
            // --- AJUSTE WEBVIEW ---
            // Adiciona a detecção de WebView mais comum no Android, garantindo que não seja Safari (iOS)
            const isWebView = navigator.userAgent.includes('wv') || (navigator.userAgent.includes('Mobile') && !navigator.userAgent.includes('Safari'));
            
            // Tenta detectar se o app está rodando em um navegador móvel, mas sem o prompt de instalação
            const isRunningInApp = isStandalone || isWebView || (document.referrer.includes('android-app://') || document.referrer.includes('ios-app://'));

            return isRunningInApp;
        }

        // --- FUNÇÕES DE FAVORITOS ---

        /** Carrega a lista de IDs de favoritos do LocalStorage. */
        function getFavorites() {
            const favoritesJson = localStorage.getItem(FAVORITES_KEY);
            return favoritesJson ? JSON.parse(favoritesJson) : [];
        }

        /** Salva a lista de IDs de favoritos no LocalStorage. */
        function saveFavorites(favorites) {
            localStorage.setItem(FAVORITES_KEY, JSON.stringify(favorites));
        }

        /** Verifica se um hino está favoritado. */
        function isFavorite(id) {
            return getFavorites().includes(id);
        }

        /** Alterna o status de favorito de um hino. */
        function toggleFavorite(id) {
            let favorites = getFavorites();
            if (isFavorite(id)) {
                favorites = favorites.filter(favId => favId !== id);
                alert('Hino removido dos favoritos!');
            } else {
                favorites.push(id);
                alert('Hino adicionado aos favoritos!');
            }
            saveFavorites(favorites);
            updateFavoriteButtonState(id);
            renderFavoritesList(); // Atualiza a lista de favoritos
        }

        /** Atualiza o ícone do botão de favorito. */
        function updateFavoriteButtonState(id) {
            const isFav = isFavorite(id);
            if (isFav) {
                favIcon.classList.remove('text-gray-400');
                favIcon.classList.add('text-red-500', 'fill-current');
            } else {
                favIcon.classList.add('text-gray-400');
                favIcon.classList.remove('text-red-500', 'fill-current');
            }
        }
        
        // --- FUNÇÕES DE TELA ---

        /** Alterna a visualização entre as telas. */
        function switchScreen(screenId) {
            listScreen.classList.add('hidden-screen');
            viewScreen.classList.add('hidden-screen');
            favoritesScreen.classList.add('hidden-screen');

            // Remove a classe 'hidden-screen' da tela desejada
            if (screenId === 'list') {
                listScreen.classList.remove('hidden-screen');
                // Se voltar da tela de favoritos, precisa renderizar a lista
                searchHymns(); 
            } else if (screenId === 'view') {
                viewScreen.classList.remove('hidden-screen');
            } else if (screenId === 'favorites') {
                favoritesScreen.classList.remove('hidden-screen');
                renderFavoritesList();
            }
            
            // Rola para o topo da nova tela (ou do corpo do app)
            window.scrollTo(0, 0); 
        }

        // --- FUNÇÕES DE RENDERIZAÇÃO ---

        /** Renderiza o item de lista de um hino. */
        function createHymnListItem(hymn, inFavorites = false) {
            const item = document.createElement('div');
            item.className = 'flex items-center p-4 bg-white rounded-xl shadow-sm border border-border-color hover:bg-accent-light cursor-pointer transition duration-150';
            item.onclick = () => showHymn(hymn.id);

            // Número do Hino
            const idSpan = document.createElement('span');
            idSpan.textContent = hymn.id.toString().padStart(3, '0'); // Formata para 001, 010, etc.
            idSpan.className = 'font-bold text-lg text-accent w-12 flex-shrink-0';

            // Nome do Hino
            const nameSpan = document.createElement('span');
            nameSpan.textContent = hymn.nome;
            nameSpan.className = 'flex-grow text-primary ml-4 truncate';

            item.appendChild(idSpan);
            item.appendChild(nameSpan);
            
            // Adiciona botão de remover na lista de favoritos
            if (inFavorites) {
                const removeButton = document.createElement('button');
                removeButton.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 text-red-400 hover:text-red-600 ml-2"><path fill-rule="evenodd" d="M16.5 4.478c.227 0 .445.034.654.101 2.38 3.018 3.52 7.02 3.193 11.238-.415 5.58-5.32 9.872-10.59 9.872S3.012 19.397 2.597 13.818c-.327-4.218.813-8.22 3.193-11.238A1.85 1.85 0 017 2.25h10.5c.227 0 .445.034.654.101zM8 8.5v7.5a.75.75 0 001.5 0V8.5a.75.75 0 00-1.5 0zm4.5 0v7.5a.75.75 0 001.5 0V8.5a.75.75 0 00-1.5 0zm4.5 0v7.5a.75.75 0 001.5 0V8.5a.75.75 0 00-1.5 0z" clip-rule="evenodd" /></svg>`;
                removeButton.className = 'flex-shrink-0';
                removeButton.onclick = (e) => {
                    e.stopPropagation(); // Evita que o click abra o hino
                    toggleFavorite(hymn.id);
                };
                item.appendChild(removeButton);
            }

            return item;
        }

        /** Renderiza a lista de hinos completa ou filtrada. */
        function renderHymnList(filteredHymns) {
            listContainer.innerHTML = '';
            
            if (filteredHymns.length === 0) {
                noResults.classList.remove('hidden');
                return;
            }

            noResults.classList.add('hidden');
            filteredHymns.forEach(hymn => {
                listContainer.appendChild(createHymnListItem(hymn));
            });
        }
        
        /** Renderiza a lista de hinos favoritos. */
        function renderFavoritesList() {
            favoritesListContainer.innerHTML = '';
            const favoriteIds = getFavorites();
            
            if (favoriteIds.length === 0) {
                noFavorites.classList.remove('hidden');
                return;
            }
            
            noFavorites.classList.add('hidden');
            const favoriteHymns = hymnData.filter(h => favoriteIds.includes(h.id));
            
            favoriteHymns.forEach(hymn => {
                // Passa 'true' para inFavorites para adicionar o botão de remover
                favoritesListContainer.appendChild(createHymnListItem(hymn, true)); 
            });
        }

        // --- FUNÇÕES DE BUSCA ---

        /** Filtra a lista de hinos com base no texto de busca. */
        function searchHymns() {
            const query = searchInput.value.toLowerCase().trim();

            const filtered = hymnData.filter(hymn => {
                // Busca por ID (número)
                const idMatch = hymn.id.toString().includes(query);
                // Busca por nome
                const nameMatch = hymn.nome.toLowerCase().includes(query);

                return idMatch || nameMatch;
            });

            renderHymnList(filtered);
        }

        // --- FUNÇÕES DE VISUALIZAÇÃO DO HINO ---

        /** Exibe a letra de um hino específico. */
        function showHymn(id) {
            const hymn = hymnData.find(h => h.id === id);

            if (hymn) {
                currentHymnId = id;

                // Atualiza o conteúdo da tela de visualização
                hymnTitleDisplay.textContent = `${hymn.id.toString().padStart(3, '0')} - ${hymn.nome}`;
                hymnLyricsDisplay.textContent = hymn.letra;
                
                // Atualiza o estado do botão de favorito
                updateFavoriteButtonState(id);
                
                // Aplica o tamanho de fonte salvo
                applyFontSize();

                // Alterna para a tela de visualização
                switchScreen('view');
            } else {
                console.error(`Hino com ID ${id} não encontrado.`);
            }
        }
        
        // --- FUNÇÕES DE CONTROLE DE FONTE ---

        /** Carrega e aplica o tamanho de fonte salvo no LocalStorage. */
        function applyFontSize() {
            let currentSize = parseFloat(localStorage.getItem(FONT_SIZE_KEY)) || MIN_FONT_SIZE;
            // Garante que o tamanho está dentro dos limites
            currentSize = Math.max(MIN_FONT_SIZE, Math.min(MAX_FONT_SIZE, currentSize)); 
            
            hymnLyricsDisplay.style.fontSize = `${currentSize}rem`;
            localStorage.setItem(FONT_SIZE_KEY, currentSize.toFixed(1));
        }

        /** Ajusta o tamanho da fonte em um passo. */
        function adjustFontSize(step) {
            let currentSize = parseFloat(localStorage.getItem(FONT_SIZE_KEY)) || MIN_FONT_SIZE;
            let newSize = currentSize + step;
            
            // Limites
            newSize = Math.max(MIN_FONT_SIZE, Math.min(MAX_FONT_SIZE, newSize)); 
            
            localStorage.setItem(FONT_SIZE_KEY, newSize.toFixed(1));
            applyFontSize();
        }
        
        // --- INICIALIZAÇÃO E LISTENERS ---
        
        window.onload = function() {
            // PWA Service Worker Registration
            if ('serviceWorker' in navigator) {
                // --- CORREÇÃO PWA GITHUB PAGES ---
                // Registra o Service Worker, definindo o escopo explícito para a subpasta do GitHub Pages (/hbj/)
                navigator.serviceWorker.register('./service-worker.js', { 
                    scope: '/hbj/' // MUDE ISTO!
                })
                    .then(reg => console.log('Service Worker Registrado', reg))
                    .catch(err => console.error('Erro ao registrar Service Worker', err));
            }
            
            // O código de instalação PWA só deve rodar se NÃO estiver em um app nativo/instalado.
            if (!isRunningInApp()) {
                
                // 1. Captura o evento nativo do navegador para instalação
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    deferredPrompt = e;
                    // Mostra o botão personalizado de instalação
                    installButtonContainer.classList.remove('hidden');
                });

                // 2. Listener do botão personalizado
                installButton.addEventListener('click', async () => {
                    if (deferredPrompt) {
                        // Esconde o botão (só pode ser usado uma vez)
                        installButtonContainer.classList.add('hidden');
                        
                        // Dispara o prompt de instalação
                        deferredPrompt.prompt();
                        
                        // Espera o usuário responder
                        const { outcome } = await deferredPrompt.userChoice;
                        
                        if (outcome === 'accepted') {
                            console.log('Usuário aceitou a instalação.');
                        } else {
                            console.log('Usuário recusou a instalação.');
                            // Se recusou, pode reexibir o botão ou não, dependendo da estratégia
                            // installButtonContainer.classList.remove('hidden'); 
                        }
                        
                        deferredPrompt = null;
                    }
                });
                
                // Listener para quando o PWA for instalado
                window.addEventListener('appinstalled', () => {
                    installButtonContainer.classList.add('hidden');
                    console.log('PWA instalado com sucesso!');
                });
            }


            // Renderiza a lista completa ao carregar
            renderHymnList(hymnData);
            
            // Inicializa o tamanho da fonte
            applyFontSize();

            // Listeners de Busca e Telas
            searchInput.addEventListener('input', searchHymns);
            backButton.addEventListener('click', () => switchScreen('list'));
            navList.addEventListener('click', () => switchScreen('list'));
            navFavorites.addEventListener('click', () => switchScreen('favorites'));
            
            // Listeners de Favoritos
            favoriteToggleButton.addEventListener('click', () => {
                if (currentHymnId !== null) {
                    toggleFavorite(currentHymnId);
                }
            });
            
            // Listeners de Controle de Fonte
            fontIncreaseButton.addEventListener('click', () => adjustFontSize(FONT_STEP));
            fontDecreaseButton.addEventListener('click', () => adjustFontSize(-FONT_STEP));
        };
    </script>
</body>
</html>
